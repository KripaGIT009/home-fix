# location-service - per-service values for helm/homefix-service.
# Mirrors the service's entry in docker-compose.core.yml, minus dev-only settings
# (inline secrets, ddl-auto=update, debug logging, dev seeding/OTP echo).
# The port must equal the Dockerfile EXPOSE and compose SERVER_PORT.

serviceName: location-service
containerPort: 8092

dependencies:
  postgres: true
  redis: true
  kafka: true

# Keys read from the existing Secret "location-service-secrets". DB_* keys are added
# automatically by dependencies.postgres (db_host, db_port, db_name, db_username,
# db_password).
secrets:
  env:
    JWT_SECRET: jwt_secret
    # Presented to the Booking Service's internal endpoints to check who may read or
    # post a booking's position.
    INTERNAL_API_KEY: internal_api_key

config:
  LOCATION_STORE: "redis"
  BOOKING_SERVICE_URL: "http://booking-service:8084"
