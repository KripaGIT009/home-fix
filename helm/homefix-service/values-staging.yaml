# Staging overrides for the shared homefix-service chart.
# Applied by the CI workflow: --values helm/homefix-service/values-staging.yaml

environment: staging

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

config:
  SPRING_PROFILES_ACTIVE: staging
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring:4317"
  LOG_LEVEL: DEBUG

podDisruptionBudget:
  enabled: false

topologySpreadConstraints:
  enabled: false
