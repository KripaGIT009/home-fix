apiVersion: v2
name: homefix-service
description: >
  Shared Helm chart template for all HomeFix microservices.
  Every service supplies its own values.yaml (or values-<env>.yaml) to customise
  replica count, image, resources, HPA thresholds, environment variables, and
  ingress rules.

type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
