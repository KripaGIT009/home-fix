apiVersion: v1
kind: Service
metadata:
  name: {{ include "homefix-service.fullname" . }}
  labels:
    {{- include "homefix-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Same port as the container by default, so <service>:<port> matches compose.
    - port: {{ .Values.service.port | default (include "homefix-service.port" .) }}
      targetPort: http
      protocol: TCP
      name: {{ .Values.service.portName }}
    {{- range .Values.extraPorts }}
    # A further service hosted by this deployable, on the port it has in compose.
    - port: {{ .port }}
      targetPort: {{ .name }}
      protocol: TCP
      name: {{ .name }}
    {{- end }}
  selector:
    {{- include "homefix-service.selectorLabels" . | nindent 4 }}
