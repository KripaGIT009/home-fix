# Production overrides for the shared homefix-service chart.
# Applied by the CD workflow: --values helm/homefix-service/values-production.yaml

environment: production

replicaCount: 3

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 1536Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

config:
  SPRING_PROFILES_ACTIVE: production
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring:4317"
  LOG_LEVEL: INFO

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  enabled: true
