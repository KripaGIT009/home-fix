name: PR Checks — Lint, Test, Coverage Gate

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened

# Cancel in-flight runs for the same PR when a new commit is pushed.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # ─────────────────────────────────────────────
  # Detect changed services
  # ─────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      has_services: ${{ steps.changes.outputs.has_services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed service directories
        id: changes
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Find service directories that contain a pom.xml and have changed files
          CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            | grep '^services/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          if [ "${CHANGED}" = "[]" ] || [ -z "${CHANGED}" ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "has_services=false" >> "$GITHUB_OUTPUT"
          else
            echo "services=${CHANGED}" >> "$GITHUB_OUTPUT"
            echo "has_services=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Changed services: ${CHANGED}"

  # ─────────────────────────────────────────────
  # Lint all changed services
  # ─────────────────────────────────────────────
  lint:
    name: Lint — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Checkstyle for ${{ matrix.service }}
        run: |
          if [ -f "services/${{ matrix.service }}/pom.xml" ]; then
            mvn -f "services/${{ matrix.service }}/pom.xml" checkstyle:check --no-transfer-progress
          fi

  # ─────────────────────────────────────────────
  # Lint Helm charts (always runs)
  # ─────────────────────────────────────────────
  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: |
          helm lint helm/homefix-service \
            --set image.repository=placeholder \
            --set image.tag=latest \
            --strict

  # ─────────────────────────────────────────────
  # Lint GitHub Actions workflows (always runs)
  # ─────────────────────────────────────────────
  lint-actions:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint-action@v1

  # ─────────────────────────────────────────────
  # Unit tests + coverage gate per changed service
  # ─────────────────────────────────────────────
  unit-test:
    name: Unit Tests + Coverage — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests with JaCoCo coverage
        run: |
          if [ -f "services/${{ matrix.service }}/pom.xml" ]; then
            mvn -f "services/${{ matrix.service }}/pom.xml" verify --no-transfer-progress
          else
            echo "Skipping — no pom.xml for ${{ matrix.service }}"
          fi

      - name: Enforce ≥80% line coverage
        run: |
          SERVICE_DIR="services/${{ matrix.service }}"
          REPORT="${SERVICE_DIR}/target/site/jacoco/jacoco.csv"
          if [ ! -f "${REPORT}" ]; then
            echo "JaCoCo report not found — skipping coverage check."
            exit 0
          fi

          # Sum MISSED and COVERED from the LINE column
          MISSED=$(awk -F',' 'NR>1 {sum += $8} END {print sum+0}' "${REPORT}")
          COVERED=$(awk -F',' 'NR>1 {sum += $9} END {print sum+0}' "${REPORT}")
          TOTAL=$((MISSED + COVERED))

          if [ "${TOTAL}" -eq 0 ]; then
            echo "No lines to measure — skipping."
            exit 0
          fi

          COVERAGE=$(awk "BEGIN {printf \"%.2f\", ${COVERED}/${TOTAL}*100}")
          echo "Line coverage: ${COVERAGE}%"

          # Fail if below 80%
          awk "BEGIN { exit (${COVERED}/${TOTAL} < 0.80) ? 1 : 0 }" || \
            (echo "Coverage ${COVERAGE}% is below the required 80% threshold." && exit 1)

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/site/jacoco/

  # ─────────────────────────────────────────────
  # Dockerfile build validation (dry-run)
  # ─────────────────────────────────────────────
  dockerfile-validate:
    name: Validate Dockerfile — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_services == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile (build without push)
        run: |
          DOCKERFILE="services/${{ matrix.service }}/Dockerfile"
          if [ -f "${DOCKERFILE}" ]; then
            docker buildx build \
              --file "${DOCKERFILE}" \
              --tag "${{ matrix.service }}:pr-validate" \
              --load \
              "services/${{ matrix.service }}" || true
          else
            echo "No Dockerfile found for ${{ matrix.service }} — checking base image."
            docker buildx build \
              --file Dockerfile.base \
              --tag "homefix-base:pr-validate" \
              --load \
              . || true
          fi

  # ─────────────────────────────────────────────
  # Final status check (branch protection target)
  # ─────────────────────────────────────────────
  pr-gate:
    name: PR Gate — All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - lint-helm
      - lint-actions
      - unit-test
      - dockerfile-validate
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          LINT="${{ needs.lint.result }}"
          HELM="${{ needs.lint-helm.result }}"
          ACTIONS="${{ needs.lint-actions.result }}"
          TESTS="${{ needs.unit-test.result }}"
          DOCKER="${{ needs.dockerfile-validate.result }}"

          echo "lint          : ${LINT}"
          echo "lint-helm     : ${HELM}"
          echo "lint-actions  : ${ACTIONS}"
          echo "unit-test     : ${TESTS}"
          echo "docker        : ${DOCKER}"

          # Jobs that were skipped (no changed services) are considered passing.
          for RESULT in "${LINT}" "${HELM}" "${ACTIONS}" "${TESTS}" "${DOCKER}"; do
            if [ "${RESULT}" = "failure" ] || [ "${RESULT}" = "cancelled" ]; then
              echo "One or more required checks failed."
              exit 1
            fi
          done

          echo "All checks passed — PR is eligible for merge."
