      PRICING_CACHE: memory
      # pricing-engine has no database and no JDBC driver on its classpath, but JPA/datasource
      # auto-config is pulled in transitively. Exclude those auto-configs so it can start.
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration"
      LOGGING_LEVEL_COM_HOMEFIX_SHARED_SECURITY: DEBUG
    ports:
