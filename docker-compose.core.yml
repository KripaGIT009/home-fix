# HomeFix — full local stack.
# Shared infra (Postgres/Redis/Kafka) + all 20 backend services + all three SPAs.
#
#   cp .env.example .env            # local-dev secrets; compose refuses to start without it
#   docker compose -f docker-compose.core.yml up -d --build
#   bash docker/seed-pricing.sh      # required before any price estimate
#
# Then open:
#   http://localhost:5173  customer-app
#   http://localhost:5174  provider-app
#   http://localhost:5175  admin-portal
#
# Each SPA proxies /api/auth to the Auth Service and /api to the API Gateway.
# Log in with any Indian mobile number; the dev SMS gateway logs the OTP instead
# of sending it:
#   docker logs homefix-core-auth-service-1 | grep "DEV SMS"
#
# NOTE: host ports for infra are remapped (5533/6380/9095) to avoid colliding
# with another local stack already using 5432/6379/9092. Service-to-service
# calls use the compose network on the default internal ports.

name: homefix-core

services:
  postgres:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: postgres:16-alpine
    # Headroom for the whole stack: every DB-backed service holds a small pool
    # (see SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE below), and the default
    # limit of 100 is not enough for 18 of them plus psql sessions.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: homefix
      POSTGRES_USER: homefix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix -d homefix"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    image: apache/kafka:3.7.1
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      # This probe starts a JVM, so it is inherently slow and the timeout has to allow for that.
      # At the previous 10s timeout with a 20s start period it failed on a loaded machine every
      # time, and because eight services depend on kafka being healthy, Compose then refused to
      # start any of them. The broker itself was running fine throughout; only the probe was
      # timing out. Widened to a realistic budget rather than reducing what it checks, since
      # listing topics is what actually proves the broker is serving requests.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s

  auth-service:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/homefix
      DB_USERNAME: homefix
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD, see .env.example}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8081"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, see .env.example}
      # Google Sign-In: set this to your Google OAuth client id and the
      # SAME value as VITE_GOOGLE_CLIENT_ID in frontend/*/.env. Empty means
      # the ID token audience cannot be validated, so social login is off.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Sign in with Apple: your Apple Services ID. Empty means Apple login is not offered.
      APPLE_SERVICES_ID: "${APPLE_SERVICES_ID:-}"
      # Dev-only SMS gateway: appends the verification code to a mounted file so
      # a login can be completed without querying container logs. Never outside dev.
      SMS_PROVIDER: file
      SMS_FILE_PATH: /var/log/homefix/dev-sms.log
      # LOCAL DEV ONLY: echo the OTP to the auth-service log so the flow can be tested
      # without a real SMS gateway. Never enable outside local/dev.
      HOMEFIX_SMS_LOGOTP: "true"
      # LOCAL DEV ONLY: create the test accounts in docs/LOCAL_ACCESS.md at startup,
      # each with a console username and this password, so the portals can be signed
      # in to on a fresh database. Staff roles cannot be self-assigned at registration,
      # so without this nothing can open the Admin Portal. Never enable outside dev.
      DEV_SEED_ENABLED: "${DEV_SEED_ENABLED:-false}"
      DEV_SEED_PASSWORD: "${DEV_SEED_PASSWORD:-}"
    ports:
      - "8081:8081"
    volumes:
      # Host-readable sink for the dev SMS gateway (see SMS_PROVIDER above).
      - ./docker/dev-sms:/var/log/homefix
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  api-gateway:
    # A transient startup race (Kafka DNS not yet resolvable during the
    # start-up stampede) otherwise leaves the service down for good, needing a
    # manual restart. Bounded, so a genuinely broken service still stops.
    restart: "on-failure:5"
    build:
      context: ./services/api-gateway
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "8080"
      HTTPS_ENFORCED: "false"
      AUTH_SERVICE_URI: http://auth-service:8081
      AUTH_INTROSPECT_URI: http://auth-service:8081/auth/introspect
      CATALOG_SERVICE_URI: http://catalog-service:8085
      CUSTOMER_SERVICE_URI: http://customer-service:8082
      BOOKING_SERVICE_URI: http://booking-service:8084
      PRICING_ENGINE_URI: http://pricing-engine:8086
      LOCATION_SERVICE_URI: http://location-service:8092
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/readiness || exit 1"]
