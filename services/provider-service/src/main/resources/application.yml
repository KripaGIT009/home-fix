spring:
  application:
    name: provider-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: provider
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  provider:
    max-active-categories: 5
    max-subcategories-per-category: 10
    min-skill-tags: 1
    max-skill-tags: 20
    min-years-experience: 0
    max-years-experience: 50
    min-service-radius-km: 1
    max-service-radius-km: 100
    min-settlement-amount: 1.00
    review-rating-threshold: 3.0
  kms:
    # Selects the active KMS encryption adapter behind KmsEncryptionPort.
    # 'local' uses an AES-GCM adapter with a configured data key (dev/test); in production
    # an AWS KMS adapter can be added behind the same port without touching business logic.
    provider: ${KMS_PROVIDER:local}
    # Base64-encoded 256-bit data key used by the local AES-GCM adapter (dev/test only).
    # Required: no default, so the service fails fast when KMS_DATA_KEY is not set.
    data-key: ${KMS_DATA_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: provider-service
