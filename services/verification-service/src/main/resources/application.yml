spring:
  application:
    name: verification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    # Required: no default, so the service fails fast when DB_PASSWORD is not set.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: verification
    open-in-view: false

server:
  port: ${SERVER_PORT:8084}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    # Required: no default, so the service fails fast when JWT_SECRET is not set.
    jwt-secret: ${JWT_SECRET}
  verification:
    # S3 bucket for uploaded verification documents; stored with SSE-KMS (Requirement 5.3).
    documents-bucket: ${DOCUMENTS_BUCKET:homefix-documents}
    required-document-types:
      - GOVERNMENT_ID
      - ADDRESS_PROOF
      - SKILL_CERTIFICATION

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: verification-service
