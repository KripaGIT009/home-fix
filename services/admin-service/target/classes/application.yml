spring:
  application:
    name: admin-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homefix}
    username: ${DB_USERNAME:homefix}
    password: ${DB_PASSWORD:homefix}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: admin
    open-in-view: false

server:
  port: ${SERVER_PORT:8095}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    jwt-secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-min}
  admin:
    # Dashboard metric refresh cadence (Requirement 19.1). Must be an ISO-8601
    # duration: it feeds @Scheduled(fixedRateString), which parses ISO-8601 or a
    # plain millisecond count and rejects Boot's relaxed "60s" form.
    dashboard-refresh-interval: PT60S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: admin-service
