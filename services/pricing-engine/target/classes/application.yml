spring:
  application:
    name: pricing-engine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8086}

homefix:
  security:
    enabled: true
    # HMAC-SHA256 signing secret shared with the shared JwtValidationFilter (Task 4).
    # Must be >= 32 bytes. Injected from AWS Secrets Manager in production.
    jwt-secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-min}
  pricing:
    # Selects the active PricingConfigCachePort adapter: 'redis' (production) or 'memory'
    # (dev/test). Both enforce the same 60-second TTL so Admin parameter updates are picked up
    # by new bookings within 60 s (Requirement 6.11).
    cache: ${PRICING_CACHE:memory}
    # ISO-8601 duration; 60 seconds satisfies the Requirement 6.11 propagation bound.
    config-cache-ttl: 60s
    # Multiplier caps (Requirement 6.2, 6.3). Emergency is applied first, then surge; the
    # combined effective multiplier is capped at the sum of these two (Requirement 6.4).
    max-emergency-multiplier: 2.0
    max-surge-multiplier: 2.0
    # Minimum permissible final total (Requirement 6.1).
    min-total: 0.01
    # Monetary rounding scale/mode applied to every component and the total.
    money-scale: 2
    money-rounding: HALF_UP
    # Local timezone used to evaluate night/weekend surcharge windows (Requirement 6.5, 6.6).
    zone-id: ${PRICING_ZONE:UTC}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
      base-path: /
  endpoint:
    health:
      probes:
        enabled: true
  # Do not fail readiness on Redis in the in-memory cache profile.
  health:
    redis:
      enabled: ${PRICING_REDIS_HEALTH:false}
  metrics:
    tags:
      application: pricing-engine
